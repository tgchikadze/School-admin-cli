<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналитика — Биотех225</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        .stat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:1rem; margin-bottom:2rem; }
        .stat-card { text-align:center; padding:1rem; border-radius:.5rem; background:var(--pico-card-background-color); border:1px solid var(--pico-muted-border-color); }
        .stat-card .num { font-size:2rem; font-weight:700; color:var(--pico-primary); }
        .stat-card .label { font-size:.85rem; color:var(--pico-muted-color); }
        .chart-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(350px,1fr)); gap:1.5rem; }
        .chart-grid article { padding:1.5rem; }
        .bar-row { display:flex; align-items:center; margin-bottom:.4rem; }
        .bar-label { width:120px; font-size:.85rem; text-align:right; padding-right:.8rem; }
        .bar-track { flex:1; background:var(--pico-muted-border-color); border-radius:4px; height:22px; overflow:hidden; }
        .bar-fill { height:100%; background:var(--pico-primary-background); border-radius:4px; display:flex; align-items:center; padding-left:.4rem; font-size:.75rem; color:var(--pico-primary-inverse); font-weight:600; min-width:20px; }
        .btn-sm { padding:.3rem .6rem; font-size:.85rem; }
        .finance-row { display:flex; justify-content:space-between; padding:.4rem 0; border-bottom:1px solid var(--pico-muted-border-color); }
        .finance-row:last-child { border:none; font-weight:700; font-size:1.1rem; }
    </style>
</head>
<body>
<nav class="container-fluid">
    <ul><li><a href="/"><strong>&#128300; Биотех225</strong></a></li></ul>
    <ul>
        <li>{{ username }}</li>
        <li><form method="post" action="/api/logout" style="margin:0">
            <button type="submit" class="outline secondary btn-sm">Выйти</button>
        </form></li>
    </ul>
</nav>
<main class="container">
    <h1>&#128202; Аналитика</h1>
    <div id="stats-grid" class="stat-grid"><p>Загрузка...</p></div>
    <div id="charts" class="chart-grid"></div>
</main>
<script>
    async function load() {
        const r = await fetch('/api/analytics/summary');
        if (r.status===401) { location.href='/login'; return; }
        if (!r.ok) return;
        const d = await r.json();

        // Counters
        const c = d.counters;
        const labels = {students:'Учеников',classes:'Классов',receipts:'Квитанций',universities:'Вузов',programs:'Программ',olympiads:'Олимпиад'};
        const icons = {students:'👥',classes:'🏫',receipts:'📄',universities:'🏛️',programs:'🎓',olympiads:'🏆'};
        document.getElementById('stats-grid').innerHTML = Object.entries(c).map(([k,v]) =>
            `<div class="stat-card"><div>${icons[k]||''}</div><div class="num">${v}</div><div class="label">${labels[k]||k}</div></div>`
        ).join('');

        // Charts
        let html = '';

        // Students by class
        const maxSt = Math.max(...d.students_by_class.map(x=>x.count), 1);
        html += `<article><h4>Ученики по классам</h4>${d.students_by_class.map(x =>
            `<div class="bar-row"><div class="bar-label">${x.class_name} кл.</div><div class="bar-track"><div class="bar-fill" style="width:${(x.count/maxSt*100)}%">${x.count}</div></div></div>`
        ).join('')}</article>`;

        // Revenue by class
        const maxRev = Math.max(...d.revenue_by_class.map(x=>x.revenue), 1);
        html += `<article><h4>Доход по классам (руб./мес)</h4>${d.revenue_by_class.map(x =>
            `<div class="bar-row"><div class="bar-label">${x.class_name} кл.</div><div class="bar-track"><div class="bar-fill" style="width:${(x.revenue/maxRev*100)}%">${x.revenue.toLocaleString()}</div></div></div>`
        ).join('')}</article>`;

        // Finance summary
        const f = d.finance;
        html += `<article><h4>Финансовая сводка</h4>
            <div class="finance-row"><span>Ежемесячный доход</span><span>${f.monthly_revenue.toLocaleString()} &#8381;</span></div>
            <div class="finance-row"><span>Общая компенсация</span><span>${f.total_compensation.toLocaleString()} &#8381;</span></div>
            <div class="finance-row"><span>Сумма квитанций</span><span>${f.receipts_total.toLocaleString()} &#8381;</span></div>
        </article>`;

        // Popular exams
        if (d.popular_exams.length) {
            const maxE = Math.max(...d.popular_exams.map(x=>x.count), 1);
            html += `<article><h4>Популярные ЕГЭ</h4>${d.popular_exams.map(x =>
                `<div class="bar-row"><div class="bar-label">${x.subject}</div><div class="bar-track"><div class="bar-fill" style="width:${(x.count/maxE*100)}%">${x.count}</div></div></div>`
            ).join('')}</article>`;
        }

        // Top universities
        if (d.top_universities.length) {
            const maxU = Math.max(...d.top_universities.map(x=>x.programs_count), 1);
            html += `<article><h4>Топ вузов по программам</h4>${d.top_universities.map(x =>
                `<div class="bar-row"><div class="bar-label" style="width:180px">${x.name.length>25?x.name.slice(0,25)+'…':x.name}</div><div class="bar-track"><div class="bar-fill" style="width:${(x.programs_count/maxU*100)}%">${x.programs_count}</div></div></div>`
            ).join('')}</article>`;
        }

        // Olympiads review
        const ol = d.olympiads_review;
        if (ol.reviewed + ol.unreviewed > 0) {
            const pct = Math.round(ol.reviewed/(ol.reviewed+ol.unreviewed)*100);
            html += `<article><h4>Ревью олимпиад</h4>
                <div class="bar-row"><div class="bar-label">Проверено</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:#198754">${ol.reviewed}</div></div></div>
                <div class="bar-row"><div class="bar-label">Не проверено</div><div class="bar-track"><div class="bar-fill" style="width:${100-pct}%; background:#dc3545">${ol.unreviewed}</div></div></div>
            </article>`;
        }

        document.getElementById('charts').innerHTML = html;
    }
    load();
</script>
</body>
</html>
