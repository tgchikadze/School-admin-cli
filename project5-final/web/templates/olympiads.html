<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Олимпиады — Биотех225</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        .toolbar { display:flex; gap:1rem; align-items:end; flex-wrap:wrap; margin-bottom:1rem; }
        .toolbar > * { margin-bottom:0; }
        .btn-sm { padding:.3rem .6rem; font-size:.85rem; margin:.1rem; }
        table { font-size:.85rem; }
        dialog { max-width:550px; }
        .review-yes { color:#198754; font-weight:700; }
        .review-no { color:#dc3545; }
    </style>
</head>
<body>
<nav class="container-fluid">
    <ul><li><a href="/"><strong>&#128300; Биотех225</strong></a></li></ul>
    <ul>
        <li>{{ username }}</li>
        <li><form method="post" action="/api/logout" style="margin:0">
            <button type="submit" class="outline secondary btn-sm">Выйти</button>
        </form></li>
    </ul>
</nav>
<main class="container">
    <h1>&#127942; Олимпиады</h1>
    <div class="toolbar">
        <select id="uni-filter" onchange="loadOly()"><option value="">Все вузы</option></select>
        <select id="rev-filter" onchange="loadOly()">
            <option value="">Все</option><option value="true">Проверенные</option><option value="false">Непроверенные</option>
        </select>
        <input type="search" id="oly-search" placeholder="Поиск..." oninput="loadOly()" style="max-width:200px">
        <button class="btn-sm" onclick="openDialog()">+ Добавить</button>
    </div>
    <figure><table>
        <thead><tr><th>Вуз</th><th>Олимпиада</th><th>Ур.</th><th>Предмет</th><th>Льгота</th><th>Ревью</th><th></th></tr></thead>
        <tbody id="oly-body"><tr><td colspan="7">Загрузка...</td></tr></tbody>
    </table></figure>
</main>
<dialog id="oly-dialog">
    <article>
        <header><h3 id="dialog-title">Новая олимпиада</h3></header>
        <label>Вуз <select id="o-uni"></select></label>
        <label>Название <input type="text" id="o-name" required></label>
        <label>Уровень <input type="number" id="o-level" min="1" max="3"></label>
        <label>Предмет <input type="text" id="o-subject"></label>
        <label>Тип льготы <input type="text" id="o-benefit-type" placeholder="БВИ / 100 баллов"></label>
        <label>Детали <textarea id="o-benefit-detail" rows="2"></textarea></label>
        <label>Источник (URL) <input type="url" id="o-url"></label>
        <footer>
            <button class="secondary" onclick="document.getElementById('oly-dialog').close()">Отмена</button>
            <button onclick="save()">Сохранить</button>
        </footer>
    </article>
</dialog>
<script>
    let unis=[], editId=null;
    async function api(u,m='GET',b=null){const o={method:m,headers:{}};if(b){o.headers['Content-Type']='application/json';o.body=JSON.stringify(b)}const r=await fetch(u,o);if(r.status===401){location.href='/login';return null}if(!r.ok){const e=await r.json().catch(()=>({}));alert(e.detail||'Error');return null}return r.json()}

    async function loadUnis(){
        unis = await api('/api/universities') || [];
        ['uni-filter','o-uni'].forEach(id => {
            const s=document.getElementById(id);
            if(id==='uni-filter') s.innerHTML='<option value="">Все вузы</option>';
            else s.innerHTML='';
            unis.forEach(u=>s.innerHTML+=`<option value="${u.id}">${u.name}</option>`);
        });
    }

    async function loadOly(){
        const uid=document.getElementById('uni-filter').value;
        const rev=document.getElementById('rev-filter').value;
        const s=document.getElementById('oly-search').value.trim();
        let url='/api/olympiads?';
        if(uid)url+=`university_id=${uid}&`;
        if(rev!=='')url+=`reviewed=${rev}&`;
        if(s)url+=`search=${encodeURIComponent(s)}&`;
        const olys=await api(url)||[];
        const umap={};unis.forEach(u=>umap[u.id]=u.name);
        const body=document.getElementById('oly-body');
        if(!olys.length){body.innerHTML='<tr><td colspan="7">Нет олимпиад</td></tr>';return;}
        body.innerHTML=olys.map(o=>`<tr>
            <td>${umap[o.university_id]||o.university_id}</td>
            <td>${o.olympiad_name}</td><td>${o.olympiad_level||'—'}</td>
            <td>${o.subject||'—'}</td>
            <td>${o.benefit_type||'—'}</td>
            <td class="${o.reviewed?'review-yes':'review-no'}" style="cursor:pointer" onclick="toggleReview(${o.id})">${o.reviewed?'✅':'❌'}</td>
            <td>
                <button class="btn-sm outline" onclick='openDialog(${JSON.stringify(o)})'>✏️</button>
                <button class="btn-sm outline secondary" onclick="del(${o.id})">🗑️</button>
            </td>
        </tr>`).join('');
    }

    async function toggleReview(id){await api(`/api/olympiads/${id}/review`,'PATCH');loadOly();}

    function openDialog(o=null){
        editId=o?o.id:null;
        document.getElementById('dialog-title').textContent=o?'Редактировать':'Новая олимпиада';
        document.getElementById('o-uni').value=o?o.university_id:(unis[0]?.id||'');
        document.getElementById('o-name').value=o?o.olympiad_name:'';
        document.getElementById('o-level').value=o?o.olympiad_level||'':'';
        document.getElementById('o-subject').value=o?o.subject||'':'';
        document.getElementById('o-benefit-type').value=o?o.benefit_type||'':'';
        document.getElementById('o-benefit-detail').value=o?o.benefit_detail||'':'';
        document.getElementById('o-url').value=o?o.source_url||'':'';
        document.getElementById('oly-dialog').showModal();
    }

    async function save(){
        const b={university_id:parseInt(document.getElementById('o-uni').value),olympiad_name:document.getElementById('o-name').value.trim(),olympiad_level:parseInt(document.getElementById('o-level').value)||null,subject:document.getElementById('o-subject').value.trim()||null,benefit_type:document.getElementById('o-benefit-type').value.trim()||null,benefit_detail:document.getElementById('o-benefit-detail').value.trim()||null,source_url:document.getElementById('o-url').value.trim()||null,reviewed:false};
        if(!b.olympiad_name){alert('Укажите название');return;}
        const url=editId?`/api/olympiads/${editId}`:'/api/olympiads';
        if(await api(url,editId?'PUT':'POST',b)){document.getElementById('oly-dialog').close();loadOly();}
    }

    async function del(id){if(!confirm('Удалить?'))return;await api(`/api/olympiads/${id}`,'DELETE');loadOly();}

    loadUnis().then(()=>loadOly());
</script>
</body>
</html>
