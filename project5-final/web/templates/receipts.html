<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квитанции — Биотех225</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        .tabs { display: flex; gap: 0; margin-bottom: 1.5rem; }
        .tabs button {
            flex: 1; padding: 0.6rem; border: 1px solid var(--pico-muted-border-color);
            background: var(--pico-card-background-color); cursor: pointer;
            font-weight: 600; color: var(--pico-muted-color);
        }
        .tabs button:first-child { border-radius: 0.375rem 0 0 0.375rem; }
        .tabs button:last-child { border-radius: 0 0.375rem 0.375rem 0; }
        .tabs button.active {
            background: var(--pico-primary-background);
            color: var(--pico-primary-inverse);
            border-color: var(--pico-primary-background);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .toolbar { display: flex; gap: 1rem; align-items: end; flex-wrap: wrap; margin-bottom: 1rem; }
        .toolbar > * { margin-bottom: 0; }
        table { font-size: 0.9rem; }
        .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.85rem; margin: 0.1rem; }
        .hidden { display: none !important; }
        .student-check { margin-right: 0.5rem; }
        .amount { font-weight: 700; }
        .amount-positive { color: green; }
        .amount-negative { color: red; }
        .batch-bar {
            position: sticky; bottom: 0; background: var(--pico-card-background-color);
            border-top: 2px solid var(--pico-primary-background);
            padding: 0.8rem 1rem; display: flex; align-items: center;
            justify-content: space-between; gap: 1rem;
        }
        .batch-bar.hidden { display: none !important; }
    </style>
</head>
<body>
<nav class="container-fluid">
    <ul><li><a href="/"><strong>&#128300; Биотех225</strong></a></li></ul>
    <ul>
        <li>{{ username }}</li>
        <li><form method="post" action="/api/logout" style="margin:0">
            <button type="submit" class="outline secondary btn-sm">Выйти</button>
        </form></li>
    </ul>
</nav>

<main class="container">
    <h1>&#128196; Квитанции</h1>

    <div class="tabs">
        <button class="active" onclick="switchTab('generate', this)">Сгенерировать</button>
        <button onclick="switchTab('history', this)">История</button>
    </div>

    <!-- ═══════ TAB: GENERATE ═══════ -->
    <section id="tab-generate" class="tab-content active">
        <div class="toolbar">
            <select id="gen-class-filter" onchange="loadStudentsForGen()">
                <option value="">Все классы</option>
            </select>
            <input type="search" id="gen-search" placeholder="Поиск по ФИО..."
                   oninput="loadStudentsForGen()" style="max-width:250px">
            <button class="btn-sm" onclick="selectAll()">Выбрать все</button>
            <button class="btn-sm outline" onclick="deselectAll()">Снять все</button>
        </div>

        <figure>
        <table>
            <thead>
                <tr>
                    <th style="width:30px"><input type="checkbox" id="check-all" onchange="toggleAll(this)"></th>
                    <th>ФИО</th><th>Класс</th><th>Платёж</th>
                    <th>Баланс</th><th>К оплате</th><th></th>
                </tr>
            </thead>
            <tbody id="gen-body"><tr><td colspan="7">Загрузка...</td></tr></tbody>
        </table>
        </figure>

        <div id="batch-bar" class="batch-bar hidden">
            <span id="batch-count">Выбрано: 0</span>
            <button onclick="generateBatch()">&#128196; Сгенерировать пакет</button>
        </div>
    </section>

    <!-- ═══════ TAB: HISTORY ═══════ -->
    <section id="tab-history" class="tab-content">
        <div class="toolbar">
            <button class="btn-sm" onclick="loadHistory()">&#128260; Обновить</button>
        </div>
        <figure>
        <table>
            <thead>
                <tr><th>#</th><th>Ученик</th><th>Сумма</th><th>Дата</th><th></th></tr>
            </thead>
            <tbody id="history-body"><tr><td colspan="5">Загрузка...</td></tr></tbody>
        </table>
        </figure>
    </section>
</main>

<script>
    let allClasses = [];
    let allStudents = [];
    let selectedIds = new Set();

    function switchTab(name, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tabs button').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + name).classList.add('active');
        btn.classList.add('active');
        if (name === 'history') loadHistory();
    }

    async function api(url, method = 'GET', body = null) {
        const opts = { method, headers: {} };
        if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
        const resp = await fetch(url, opts);
        if (resp.status === 401) { location.href = '/login'; return null; }
        if (!resp.ok) { const err = await resp.json().catch(() => ({})); alert(err.detail || 'Ошибка ' + resp.status); return null; }
        if (resp.status === 204) return {};
        return resp;
    }

    async function apiJson(url, method = 'GET', body = null) {
        const resp = await api(url, method, body);
        return resp ? resp.json() : null;
    }

    // ─── Classes ────────────────────────────────────────────
    async function loadClasses() {
        allClasses = await apiJson('/api/classes') || [];
        const sel = document.getElementById('gen-class-filter');
        sel.innerHTML = '<option value="">Все классы</option>';
        allClasses.forEach(c => {
            sel.innerHTML += `<option value="${c.id}">${c.name}</option>`;
        });
    }

    // ─── Students for generation ────────────────────────────
    async function loadStudentsForGen() {
        const classId = document.getElementById('gen-class-filter').value;
        const search = document.getElementById('gen-search').value.trim();
        let url = '/api/students?';
        if (classId) url += `class_id=${classId}&`;
        if (search) url += `search=${encodeURIComponent(search)}&`;
        allStudents = await apiJson(url) || [];

        const classMap = {};
        allClasses.forEach(c => classMap[c.id] = c.name);

        const body = document.getElementById('gen-body');
        if (!allStudents.length) {
            body.innerHTML = '<tr><td colspan="7">Нет учеников</td></tr>';
            updateBatchBar();
            return;
        }

        body.innerHTML = allStudents.map(s => {
            const amountDue = s.monthly_payment - s.compensation;
            const checked = selectedIds.has(s.id) ? 'checked' : '';
            let compStr = '—';
            if (s.compensation > 0) compStr = `<span class="amount-positive">+${s.compensation}</span>`;
            else if (s.compensation < 0) compStr = `<span class="amount-negative">${s.compensation}</span>`;

            return `<tr>
                <td><input type="checkbox" class="student-check" value="${s.id}"
                    ${checked} onchange="toggleStudent(${s.id}, this.checked)"></td>
                <td>${s.full_name}</td>
                <td>${classMap[s.class_id] || s.class_id}</td>
                <td>${s.monthly_payment}&#8381;</td>
                <td>${compStr}&#8381;</td>
                <td class="amount">${amountDue}&#8381;</td>
                <td><button class="btn-sm" onclick="generateSingle(${s.id})">&#128196; PDF</button></td>
            </tr>`;
        }).join('');

        updateBatchBar();
    }

    // ─── Selection ──────────────────────────────────────────
    function toggleStudent(id, checked) {
        if (checked) selectedIds.add(id); else selectedIds.delete(id);
        updateBatchBar();
    }

    function toggleAll(el) {
        document.querySelectorAll('.student-check').forEach(cb => {
            cb.checked = el.checked;
            const id = parseInt(cb.value);
            if (el.checked) selectedIds.add(id); else selectedIds.delete(id);
        });
        updateBatchBar();
    }

    function selectAll() {
        allStudents.forEach(s => selectedIds.add(s.id));
        document.querySelectorAll('.student-check').forEach(cb => cb.checked = true);
        document.getElementById('check-all').checked = true;
        updateBatchBar();
    }

    function deselectAll() {
        selectedIds.clear();
        document.querySelectorAll('.student-check').forEach(cb => cb.checked = false);
        document.getElementById('check-all').checked = false;
        updateBatchBar();
    }

    function updateBatchBar() {
        const bar = document.getElementById('batch-bar');
        const count = selectedIds.size;
        if (count > 0) {
            bar.classList.remove('hidden');
            document.getElementById('batch-count').textContent = `Выбрано: ${count}`;
        } else {
            bar.classList.add('hidden');
        }
    }

    // ─── Generate single ────────────────────────────────────
    async function generateSingle(studentId) {
        const resp = await api('/api/receipts/generate', 'POST',
                               { student_id: studentId });
        if (!resp) return;
        const receipt = await resp.json();
        // Скачать PDF
        window.open(`/api/receipts/${receipt.id}/pdf`, '_blank');
    }

    // ─── Generate batch ─────────────────────────────────────
    async function generateBatch() {
        if (selectedIds.size === 0) { alert('Выберите учеников'); return; }

        const resp = await api('/api/receipts/batch', 'POST',
                               { student_ids: Array.from(selectedIds) });
        if (!resp) return;

        // Скачать объединённый PDF
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `batch_${new Date().toISOString().slice(0,10)}.pdf`;
        a.click();
        URL.revokeObjectURL(url);

        deselectAll();
    }

    // ─── History ────────────────────────────────────────────
    async function loadHistory() {
        const receipts = await apiJson('/api/receipts') || [];
        const body = document.getElementById('history-body');

        if (!receipts.length) {
            body.innerHTML = '<tr><td colspan="5">Нет квитанций</td></tr>';
            return;
        }

        // Нужны имена учеников — загрузим
        const studentMap = {};
        const students = await apiJson('/api/students') || [];
        students.forEach(s => studentMap[s.id] = s.full_name);

        body.innerHTML = receipts.map(r => {
            const date = r.created_at
                ? new Date(r.created_at).toLocaleString('ru-RU')
                : '—';
            return `<tr>
                <td>${r.id}</td>
                <td>${studentMap[r.student_id] || 'ID: ' + r.student_id}</td>
                <td class="amount">${r.amount}&#8381;</td>
                <td>${date}</td>
                <td>
                    <button class="btn-sm" onclick="window.open('/api/receipts/${r.id}/pdf','_blank')">&#128196;</button>
                    <button class="btn-sm outline secondary" onclick="deleteReceipt(${r.id})">&#128465;</button>
                </td>
            </tr>`;
        }).join('');
    }

    async function deleteReceipt(id) {
        if (!confirm('Удалить квитанцию?')) return;
        await apiJson(`/api/receipts/${id}`, 'DELETE');
        loadHistory();
    }

    // ─── Init ───────────────────────────────────────────────
    loadClasses().then(() => loadStudentsForGen());
</script>
</body>
</html>
