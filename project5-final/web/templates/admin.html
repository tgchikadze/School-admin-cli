<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — Биотех225</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        .tabs { display:flex; gap:0; margin-bottom:1.5rem; }
        .tabs button { flex:1; padding:.6rem; border:1px solid var(--pico-muted-border-color); background:var(--pico-card-background-color); cursor:pointer; font-weight:600; color:var(--pico-muted-color); }
        .tabs button:first-child { border-radius:.375rem 0 0 .375rem; }
        .tabs button:last-child { border-radius:0 .375rem .375rem 0; }
        .tabs button.active { background:var(--pico-primary-background); color:var(--pico-primary-inverse); border-color:var(--pico-primary-background); }
        .tab-content { display:none; } .tab-content.active { display:block; }
        .stat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:1rem; margin-bottom:1.5rem; }
        .stat-card { text-align:center; padding:1rem; border-radius:.5rem; background:var(--pico-card-background-color); border:1px solid var(--pico-muted-border-color); }
        .stat-card .num { font-size:2rem; font-weight:700; color:var(--pico-primary); }
        .stat-card .label { font-size:.85rem; color:var(--pico-muted-color); }
        .btn-sm { padding:.3rem .6rem; font-size:.85rem; margin:.1rem; }
        .hidden { display:none !important; }
        table { font-size:.9rem; }
        .danger { background:var(--pico-del-color); color:#fff; border-color:var(--pico-del-color); }
        dialog { max-width:450px; }
        .role-badge { display:inline-block; padding:.15rem .5rem; border-radius:1rem; font-size:.8rem; font-weight:600; }
        .role-admin { background:#dc3545; color:#fff; }
        .role-manager { background:#0d6efd; color:#fff; }
        .role-viewer { background:#198754; color:#fff; }
    </style>
</head>
<body>
<nav class="container-fluid">
    <ul><li><a href="/"><strong>&#128300; Биотех225</strong></a></li></ul>
    <ul>
        <li>{{ username }}</li>
        <li><form method="post" action="/api/logout" style="margin:0">
            <button type="submit" class="outline secondary btn-sm">Выйти</button>
        </form></li>
    </ul>
</nav>
<main class="container">
    <h1>&#9881;&#65039; Админ-панель</h1>

    <div class="tabs">
        <button class="active" onclick="switchTab('stats',this)">Статистика</button>
        <button onclick="switchTab('users',this)">Пользователи</button>
        <button onclick="switchTab('data',this)">Данные</button>
    </div>

    <!-- STATS -->
    <section id="tab-stats" class="tab-content active">
        <div id="stats-grid" class="stat-grid"><p>Загрузка...</p></div>
    </section>

    <!-- USERS -->
    <section id="tab-users" class="tab-content">
        <div style="margin-bottom:1rem"><button class="btn-sm" onclick="openUserDialog()">+ Новый пользователь</button></div>
        <figure><table>
            <thead><tr><th>ID</th><th>Логин</th><th>ФИО</th><th>Роль</th><th>Активен</th><th></th></tr></thead>
            <tbody id="users-body"><tr><td colspan="6">Загрузка...</td></tr></tbody>
        </table></figure>
    </section>

    <!-- DATA -->
    <section id="tab-data" class="tab-content">
        <article>
            <h4>Пересборка БД вузов</h4>
            <p>Очистить и заново загрузить universities / programs / olympiads из <code>data/partners.json</code>.</p>
            <button onclick="rebuild()">&#128260; Пересобрать из partners.json</button>
        </article>
        <article>
            <h4>Очистка таблиц</h4>
            <p>Выберите таблицу для полной очистки:</p>
            <div style="display:flex; gap:.5rem; flex-wrap:wrap">
                <button class="btn-sm outline" onclick="clearTable('universities')">Universities</button>
                <button class="btn-sm outline" onclick="clearTable('programs')">Programs</button>
                <button class="btn-sm outline" onclick="clearTable('olympiads')">Olympiads</button>
                <button class="btn-sm outline" onclick="clearTable('students')">Students</button>
                <button class="btn-sm outline" onclick="clearTable('school_classes')">Classes</button>
                <button class="btn-sm outline" onclick="clearTable('exam_choices')">Exam choices</button>
                <button class="btn-sm outline" onclick="clearTable('receipts')">Receipts</button>
            </div>
        </article>
    </section>
</main>

<!-- USER DIALOG -->
<dialog id="user-dialog">
    <article>
        <header><h3 id="user-dialog-title">Новый пользователь</h3></header>
        <label>Логин <input type="text" id="u-username" required></label>
        <label>Пароль <input type="password" id="u-password"></label>
        <label>ФИО <input type="text" id="u-fullname"></label>
        <label>Роль <select id="u-role">
            <option value="manager">Завуч</option>
            <option value="viewer">Директор</option>
            <option value="admin">Техадмин</option>
        </select></label>
        <footer>
            <button class="secondary" onclick="document.getElementById('user-dialog').close()">Отмена</button>
            <button onclick="saveUser()">Сохранить</button>
        </footer>
    </article>
</dialog>

<script>
    let editingUserId = null;

    function switchTab(n, btn) {
        document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
        document.querySelectorAll('.tabs button').forEach(e => e.classList.remove('active'));
        document.getElementById('tab-'+n).classList.add('active');
        btn.classList.add('active');
        if (n==='stats') loadStats();
        if (n==='users') loadUsers();
    }

    async function api(url, method='GET', body=null) {
        const opts = {method, headers:{}};
        if (body) { opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(body); }
        const r = await fetch(url, opts);
        if (r.status===401) { location.href='/login'; return null; }
        if (!r.ok) { const e = await r.json().catch(()=>({})); alert(e.detail||'Error '+r.status); return null; }
        return r.json();
    }

    // ─── Stats ──────────────────────────────────────────────
    async function loadStats() {
        const d = await api('/api/admin/stats');
        if (!d) return;
        const labels = {
            users:'Пользователи', school_classes:'Классы', students:'Ученики',
            exam_choices:'Выбор ЕГЭ', receipts:'Квитанции', universities:'Вузы',
            programs:'Программы', olympiads:'Олимпиады'
        };
        const icons = { users:'👤', school_classes:'🏫', students:'👥', exam_choices:'📝', receipts:'📄', universities:'🏛️', programs:'🎓', olympiads:'🏆' };
        document.getElementById('stats-grid').innerHTML = Object.entries(d).map(([k,v]) =>
            `<div class="stat-card"><div>${icons[k]||''}</div><div class="num">${v}</div><div class="label">${labels[k]||k}</div></div>`
        ).join('');
    }

    // ─── Users ──────────────────────────────────────────────
    async function loadUsers() {
        const users = await api('/api/admin/users') || [];
        const body = document.getElementById('users-body');
        body.innerHTML = users.map(u => `<tr>
            <td>${u.id}</td><td>${u.username}</td><td>${u.full_name||'—'}</td>
            <td><span class="role-badge role-${u.role}">${u.role}</span></td>
            <td>${u.is_active ? '✅' : '❌'}</td>
            <td>
                <button class="btn-sm outline" onclick="toggleActive(${u.id}, ${!u.is_active})">${u.is_active?'Выкл.':'Вкл.'}</button>
                <button class="btn-sm outline secondary" onclick="deleteUser(${u.id})">&#128465;</button>
            </td>
        </tr>`).join('');
    }

    function openUserDialog() {
        editingUserId = null;
        document.getElementById('user-dialog-title').textContent = 'Новый пользователь';
        document.getElementById('u-username').value = '';
        document.getElementById('u-password').value = '';
        document.getElementById('u-fullname').value = '';
        document.getElementById('u-role').value = 'manager';
        document.getElementById('user-dialog').showModal();
    }

    async function saveUser() {
        const body = {
            username: document.getElementById('u-username').value.trim(),
            password: document.getElementById('u-password').value,
            full_name: document.getElementById('u-fullname').value.trim(),
            role: document.getElementById('u-role').value,
        };
        if (!body.username || !body.password) { alert('Логин и пароль обязательны'); return; }
        if (await api('/api/admin/users','POST',body)) {
            document.getElementById('user-dialog').close();
            loadUsers();
        }
    }

    async function toggleActive(id, active) {
        await api(`/api/admin/users/${id}`,'PUT',{is_active:active});
        loadUsers();
    }

    async function deleteUser(id) {
        if (!confirm('Удалить пользователя?')) return;
        await api(`/api/admin/users/${id}`,'DELETE');
        loadUsers();
    }

    // ─── Data ops ───────────────────────────────────────────
    async function rebuild() {
        if (!confirm('Пересобрать БД вузов из partners.json? Старые данные будут удалены.')) return;
        const r = await api('/api/admin/rebuild','POST');
        if (r) alert(`Готово! Добавлено: ${r.added.universities} вузов, ${r.added.programs} программ, ${r.added.olympiads} олимпиад`);
        loadStats();
    }

    async function clearTable(table) {
        if (!confirm(`Очистить таблицу "${table}"? Это необратимо!`)) return;
        const r = await api(`/api/admin/clear/${table}`,'POST');
        if (r) alert(r.detail);
        loadStats();
    }

    loadStats();
</script>
</body>
</html>
