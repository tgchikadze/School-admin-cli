<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Биотех225</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .auth-card { width: 100%; max-width: 420px; padding: 2rem; }
        .tabs { display: flex; gap: 0; margin-bottom: 1.5rem; }
        .tabs button { flex: 1; padding: 0.6rem; cursor: pointer; border: 1px solid var(--pico-muted-border-color); background: var(--pico-card-background-color); color: var(--pico-muted-color); }
        .tabs button.active { background: var(--pico-primary); color: white; border-color: var(--pico-primary); }
        .tabs button:first-child { border-radius: 0.375rem 0 0 0.375rem; }
        .tabs button:last-child { border-radius: 0 0.375rem 0.375rem 0; }
        h2 { text-align: center; margin-bottom: 0.5rem; }
        .subtitle { text-align: center; color: var(--pico-muted-color); margin-bottom: 1.5rem; }
        #message { padding: 0.75rem; border-radius: 0.375rem; margin-bottom: 1rem; display: none; text-align: center; }
        #message.error { display: block; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        #message.success { display: block; background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    </style>
</head>
<body>
    <article class="auth-card">
        <h2>Биотех225</h2>
        <p class="subtitle">Система управления школой</p>

        <div class="tabs">
            <button class="active" onclick="switchTab('login')">Вход</button>
            <button onclick="switchTab('register')">Регистрация</button>
        </div>

        <div id="message"></div>

        <!-- Форма входа -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <label>Логин
                <input type="text" id="loginUsername" placeholder="Введите логин" required>
            </label>
            <label>Пароль
                <input type="password" id="loginPassword" placeholder="Введите пароль" required>
            </label>
            <button type="submit">Войти</button>
        </form>

        <!-- Форма регистрации -->
        <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
            <label>Логин
                <input type="text" id="regUsername" placeholder="Придумайте логин" required>
            </label>
            <label>ФИО
                <input type="text" id="regFullname" placeholder="Иванов Иван Иванович" required>
            </label>
            <label>Пароль
                <input type="password" id="regPassword" placeholder="Придумайте пароль" required>
            </label>
            <small>Первый зарегистрированный пользователь получает роль <strong>admin</strong>.</small>
            <button type="submit" style="margin-top: 1rem;">Зарегистрироваться</button>
        </form>
    </article>

    <script>
        function switchTab(tab) {
            const btns = document.querySelectorAll('.tabs button');
            btns.forEach(b => b.classList.remove('active'));

            if (tab === 'login') {
                btns[0].classList.add('active');
                document.getElementById('loginForm').style.display = '';
                document.getElementById('registerForm').style.display = 'none';
            } else {
                btns[1].classList.add('active');
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = '';
            }
            hideMessage();
        }

        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = type;
        }

        function hideMessage() {
            const el = document.getElementById('message');
            el.className = '';
            el.style.display = 'none';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    showMessage('Вход выполнен! Перенаправление...', 'success');
                    setTimeout(() => window.location.href = '/', 500);
                } else {
                    showMessage(data.detail || 'Ошибка входа', 'error');
                }
            } catch (err) {
                showMessage('Ошибка соединения с сервером', 'error');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const full_name = document.getElementById('regFullname').value.trim();
            const password = document.getElementById('regPassword').value;

            try {
                const res = await fetch('/api/register/json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, full_name, password })
                });
                const data = await res.json();

                if (res.ok) {
                    showMessage('Регистрация успешна! Войдите с вашим логином.', 'success');
                    setTimeout(() => switchTab('login'), 1500);
                } else {
                    showMessage(data.detail || 'Ошибка регистрации', 'error');
                }
            } catch (err) {
                showMessage('Ошибка соединения с сервером', 'error');
            }
        }
    </script>
</body>
</html>
